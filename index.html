<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta
      name="description"
      content="Vacio. is an independent digital studio in Dehradun helping businesses and emerging brands turn ideas into thoughtful digital experiences."
    />

    <meta
      name="theme-color"
      content="#050505"
    />

    <meta
      name="robots"
      content="index, follow"
    />

    <!-- Favicon -->
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/void-favicon-32-final.png"
    />

    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/void-favicon-16-final.png"
    />

    <link
      rel="apple-touch-icon"
      sizes="512x512"
      href="/void-favicon-512-final.png"
    />

      rel="preconnect"
      href="https://fonts.googleapis.com"
    />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"

    />

    <!-- Open Graph -->
    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:title"
      content="Vacio. — Give Ideas Somewhere to Exist."

    <meta

      name="twitter:card"
      content="summary_large_image"

    />

    <meta
      name="twitter:description"
      content="Websites, content and practical digital tools for businesses and emerging brands."
